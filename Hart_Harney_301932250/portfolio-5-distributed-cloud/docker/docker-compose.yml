# Lagos Community Bank — Portfolio 5 MongoDB 3-member replica set
# Prefer this Compose file when Docker bridge networking allows member-to-member
# traffic. This environment also ships scripts/05_run_host_replica.sh which runs
# the same topology on 127.0.0.1:27017-27019 (used for the captured failover evidence).
services:
  mongo1:
    image: mongo:7
    container_name: lcb-mongo1
    network_mode: host
    command: ["mongod", "--replSet", "lcbRS", "--bind_ip", "127.0.0.1", "--port", "27017"]
    volumes:
      - mongo1_data:/data/db

  mongo2:
    image: mongo:7
    container_name: lcb-mongo2
    network_mode: host
    command: ["mongod", "--replSet", "lcbRS", "--bind_ip", "127.0.0.1", "--port", "27018"]
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:7
    container_name: lcb-mongo3
    network_mode: host
    command: ["mongod", "--replSet", "lcbRS", "--bind_ip", "127.0.0.1", "--port", "27019"]
    volumes:
      - mongo3_data:/data/db

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
