# Lagos Community Bank — Portfolio 5 MongoDB 3-member replica set
services:
  mongo1:
    image: mongo:7
    container_name: lcb-mongo1
    command: ["mongod", "--replSet", "lcbRS", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo2:
    image: mongo:7
    container_name: lcb-mongo2
    command: ["mongod", "--replSet", "lcbRS", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo3:
    image: mongo:7
    container_name: lcb-mongo3
    command: ["mongod", "--replSet", "lcbRS", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
